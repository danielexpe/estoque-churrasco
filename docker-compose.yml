services:
  web:
    build: .
    container_name: estoque_web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      EXPIRY_ALERT_DAYS: ${EXPIRY_ALERT_DAYS:-7}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: estoque_churrasco
      DB_USER: ${DB_USER:-estoque}
      DB_PASS: ${DB_PASS:-estoque_local}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Administrador}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@estoque.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin12345}
      SEED_OPERATOR_PASSWORD: ${SEED_OPERATOR_PASSWORD:-operador12345}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: estoque_db
    environment:
      MYSQL_DATABASE: estoque_churrasco
      MYSQL_USER: ${DB_USER:-estoque}
      MYSQL_PASSWORD: ${DB_PASS:-estoque_local}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root_local}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASS:-root_local}"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer
    container_name: estoque_adminer
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
